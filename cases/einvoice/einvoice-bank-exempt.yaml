id: einvoice-bank-exempt
category: einvoice
title: Banking company is exempt whatever its turnover
question: A banking company with an aggregate annual turnover of Rs 800 crore issues a tax invoice to
  a registered business customer on 5 November 2026. Must it generate an e-invoice?
answer_keys:
  einvoice_required: true if the supplier must report this invoice to an IRP and obtain an IRN, otherwise
    false
expected:
  einvoice_required: false
explanation: Banking companies, insurers and financial institutions including NBFCs are exempt from e-invoicing
  regardless of turnover. The exemption attaches to the entity.
