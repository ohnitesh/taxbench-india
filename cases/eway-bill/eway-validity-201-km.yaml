id: eway-validity-201-km
category: eway-bill
title: Validity for 201 km
question: An e-way bill is generated on 5 November 2026 for ordinary (not over dimensional) cargo moved
  by road over 201 km. For how many days is it valid?
answer_keys:
  validity_days: number of days the e-way bill is valid, as a whole number
expected:
  validity_days: 2
stale_answer:
  validity_days: 3
reference:
  fn: eway_validity_days
  args:
    distance_km: 201
    km_per_day: 200
explanation: Part of a 200 km block counts as a full day, so 201 km gives 2 days. Under the earlier 100
  km rule it was 3 days.
