id: eway-validity-over-dimensional-45-km
category: eway-bill
title: Validity for over dimensional cargo, 45 km
question: An e-way bill is generated on 5 November 2026 for over dimensional cargo moved by road over
  45 km. For how many days is it valid?
answer_keys:
  validity_days: number of days the e-way bill is valid, as a whole number
expected:
  validity_days: 3
reference:
  fn: eway_validity_days
  args:
    distance_km: 45
    km_per_day: 20
explanation: 'Over dimensional cargo gets one day for every 20 km or part of it: 45 km gives 3 days.'
