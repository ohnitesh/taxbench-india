id: eway-validity-310-km
category: eway-bill
title: Validity for 310 km
question: An e-way bill is generated on 5 November 2026 for ordinary (not over dimensional) cargo moved
  by road over 310 km. For how many days is it valid?
answer_keys:
  validity_days: number of days the e-way bill is valid, as a whole number
expected:
  validity_days: 2
stale_answer:
  validity_days: 4
reference:
  fn: eway_validity_days
  args:
    distance_km: 310
    km_per_day: 200
explanation: 'Since 1 January 2021 (Notification 94/2020-Central Tax) validity is one day for every 200
  km or part of it: 310 km gives 2 days. Under the earlier 100 km rule it was 4 days, and older official
  FAQs still show that example.'
