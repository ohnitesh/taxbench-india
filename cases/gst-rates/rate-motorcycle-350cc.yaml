id: rate-motorcycle-350cc
category: gst-rates
title: Motorcycle of exactly 350 cc
question: A registered dealer in India sells a new motorcycle with an engine capacity of exactly 350 cc.
  The supply is made, invoiced and paid for on 1 October 2025. What GST rate applies?
answer_keys:
  gst_rate_percent: the total GST rate as a number, for example 12 for 12%; use 0 for nil or exempt
expected:
  gst_rate_percent: 18
stale_answer:
  gst_rate_percent: 28
explanation: Motorcycles up to 350 cc are at 18%. The 40% rate applies only to motorcycles exceeding 350
  cc, so a 350 cc model is at 18%.
