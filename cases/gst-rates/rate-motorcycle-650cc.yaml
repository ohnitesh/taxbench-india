id: rate-motorcycle-650cc
category: gst-rates
title: Motorcycle above 350 cc
question: A registered dealer in India sells a new motorcycle with an engine capacity of 650 cc. The supply
  is made, invoiced and paid for on 1 October 2025. What GST rate applies?
answer_keys:
  gst_rate_percent: the total GST rate as a number, for example 12 for 12%; use 0 for nil or exempt
expected:
  gst_rate_percent: 40
stale_answer:
  gst_rate_percent: 28
explanation: Motorcycles exceeding 350 cc moved from 28% to the 40% special rate.
