id: rate-small-petrol-car
category: gst-rates
title: Small petrol car
question: A registered dealer in India sells a new petrol car with a 1,197 cc engine and a length of 3,995
  mm. The supply is made, invoiced and paid for on 1 October 2025. What GST rate applies?
answer_keys:
  gst_rate_percent: the total GST rate as a number, for example 12 for 12%; use 0 for nil or exempt
expected:
  gst_rate_percent: 18
stale_answer:
  gst_rate_percent: 28
explanation: Petrol, LPG and CNG cars with an engine up to 1,200 cc and a length up to 4,000 mm count
  as small cars and moved from 28% to 18%.
