id: rate-tractor-oct-2025
category: gst-rates
title: Agricultural tractor after the September 2025 rate change
question: A registered dealer in India sells a new agricultural tractor with a 1,500 cc engine. The supply
  is made, invoiced and paid for on 1 October 2025. What GST rate applies?
answer_keys:
  gst_rate_percent: the total GST rate as a number, for example 12 for 12%; use 0 for nil or exempt
expected:
  gst_rate_percent: 5
stale_answer:
  gst_rate_percent: 12
explanation: Tractors moved from 12% to 5% from 22 September 2025. The exception is road tractors for
  semi-trailers above 1,800 cc.
