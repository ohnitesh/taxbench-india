id: tds-professional-fees-below-threshold
category: tds
title: Professional fees under Rs 50,000
question: The payer is a private limited company and the payee is resident in India and has furnished
  a PAN. The Income-tax Act, 2025 applies. On 15 May 2026 the company pays Rs 45,000 to a firm of chartered
  accountants for professional services. It is the only payment to this firm in the tax year. How much
  tax must the company deduct at source from this payment?
answer_keys:
  tds_amount: tax to deduct from this payment in rupees; 0 if none
expected:
  tds_amount: 0
stale_answer:
  tds_amount: 4500
reference:
  fn: tds_amount
  args:
    amount: 45000
    rate_percent: 10
    aggregate_threshold: 50000
explanation: 'The threshold for professional fees is Rs 50,000. It was Rs 30,000 until 31 March 2025,
  under which 10% of 45,000 would have been deducted: that is the outdated answer.'
