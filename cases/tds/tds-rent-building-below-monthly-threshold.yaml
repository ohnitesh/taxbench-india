id: tds-rent-building-below-monthly-threshold
category: tds
title: Office rent under Rs 50,000 a month
question: The payer is a private limited company and the payee is resident in India and has furnished
  a PAN. The Income-tax Act, 2025 applies. On 1 June 2026 the company pays Rs 45,000 as rent for May 2026
  for its office building to the landlord, a resident individual. The rent is Rs 45,000 every month. How
  much tax must the company deduct at source from this payment?
answer_keys:
  tds_amount: tax to deduct from this payment in rupees; 0 if none
expected:
  tds_amount: 0
stale_answer:
  tds_amount: 4500
reference:
  fn: tds_amount
  args:
    amount: 45000
    rate_percent: 10
    single_threshold: 50000
explanation: 'The threshold is Rs 50,000 a month. Until 31 March 2025 it was Rs 2,40,000 a year, which
  Rs 45,000 a month would have crossed: that is the outdated answer.'
