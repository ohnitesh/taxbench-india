id: tds-technical-services-fees
category: tds
title: Fees for technical services
question: The payer is a private limited company and the payee is resident in India and has furnished
  a PAN. The Income-tax Act, 2025 applies. On 15 May 2026 the company pays Rs 80,000 to a resident firm
  as fees for technical services. It is the only payment to this firm in the tax year. How much tax must
  the company deduct at source from this payment, and at what rate?
answer_keys:
  rate_percent: TDS rate applied, as a number; 0 if no tax is deductible
  tds_amount: tax to deduct from this payment in rupees; 0 if none
expected:
  rate_percent: 2
  tds_amount: 1600
reference:
  fn: tds_amount
  args:
    amount: 80000
    rate_percent: 2
    aggregate_threshold: 50000
explanation: Fees for technical services carry 2%, not the 10% that applies to professional services.
  The Rs 50,000 threshold is exceeded. 2% of 80,000 is 1,600.
