id: tds-commission-below-threshold
category: tds
title: Brokerage under Rs 20,000
question: The payer is a private limited company and the payee is resident in India and has furnished
  a PAN. The Income-tax Act, 2025 applies. On 15 May 2026 the company pays Rs 18,000 as brokerage (not
  insurance commission) to a resident broker. It is the only payment to this broker in the tax year. How
  much tax must the company deduct at source from this payment?
answer_keys:
  tds_amount: tax to deduct from this payment in rupees; 0 if none
expected:
  tds_amount: 0
reference:
  fn: tds_amount
  args:
    amount: 18000
    rate_percent: 2
    aggregate_threshold: 20000
explanation: 'Commission or brokerage other than insurance commission: 2% once the year''s total exceeds
  Rs 20,000. Rs 18,000 is under the threshold.'
