id: tds-professional-fees-above-threshold
category: tds
title: Professional fees above Rs 50,000
question: The payer is a private limited company and the payee is resident in India and has furnished
  a PAN. The Income-tax Act, 2025 applies. On 15 May 2026 the company pays Rs 60,000 to a firm of chartered
  accountants for professional services. It is the only payment to this firm in the tax year. How much
  tax must the company deduct at source from this payment, and at what rate?
answer_keys:
  rate_percent: TDS rate applied, as a number; 0 if no tax is deductible
  tds_amount: tax to deduct from this payment in rupees; 0 if none
expected:
  rate_percent: 10
  tds_amount: 6000
reference:
  fn: tds_amount
  args:
    amount: 60000
    rate_percent: 10
    aggregate_threshold: 50000
explanation: 'Fees for professional services: 10% once the year''s total exceeds Rs 50,000. 10% of 60,000
  is 6,000.'
