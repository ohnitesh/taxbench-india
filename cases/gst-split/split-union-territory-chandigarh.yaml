id: split-union-territory-chandigarh
category: gst-split
title: Sale within Chandigarh uses UTGST
question: A registered dealer in Chandigarh sells goods to a registered buyer who is also in Chandigarh,
  and the goods are delivered in Chandigarh. The taxable value is Rs 40,000 and the GST rate is 18%. Work
  out the tax on the invoice.
answer_keys:
  cgst: CGST amount in rupees, 0 if none
  sgst_utgst: SGST or UTGST amount in rupees, 0 if none
  igst: IGST amount in rupees, 0 if none
  invoice_total: invoice total including tax, in rupees
expected:
  cgst: 3600
  sgst_utgst: 3600
  igst: 0
  invoice_total: 47200
reference:
  fn: gst_split
  args:
    taxable_value: 40000
    rate_percent: 18
    supplier_state: '04'
    pos_state: '04'
explanation: 'An intra-territory supply carries CGST plus UTGST in place of SGST. The amounts are the
  same as an intra-State split: 9% each.'
sources:
- title: 'CBIC: Frequently Asked Questions on GST (levy on intra-State and inter-State supplies)'
  url: https://gstcouncil.gov.in/sites/default/files/2024-02/final-gst-fq-31218.pdf
  type: official
- title: 'CBIC: Central Goods and Services Tax Rules, 2017, Part A (rule 10 and rule 35)'
  url: https://cbic-gst.gov.in/pdf/24092021-CGST-Rules-2017-Part-A-Rules.pdf
  type: official
verification: computed
as_of: '2026-11-10'
