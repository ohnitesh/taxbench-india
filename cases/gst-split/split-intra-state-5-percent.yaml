id: split-intra-state-5-percent
category: gst-split
title: Intra-State sale at 5%
question: A registered dealer in Jaipur, Rajasthan sells goods to a registered buyer in Kota, Rajasthan.
  The goods are delivered in Kota. The taxable value is Rs 20,000 and the GST rate on these goods is 5%.
  Work out the tax on the invoice.
answer_keys:
  cgst: CGST amount in rupees, 0 if none
  sgst_utgst: SGST or UTGST amount in rupees, 0 if none
  igst: IGST amount in rupees, 0 if none
  invoice_total: invoice total including tax, in rupees
expected:
  cgst: 500
  sgst_utgst: 500
  igst: 0
  invoice_total: 21000
reference:
  fn: gst_split
  args:
    taxable_value: 20000
    rate_percent: 5
    supplier_state: 08
    pos_state: 08
explanation: Supplier and place of supply are both in Rajasthan, so the 5% is charged as CGST 2.5% plus
  SGST 2.5%.
sources:
- title: 'CBIC: Frequently Asked Questions on GST (levy on intra-State and inter-State supplies)'
  url: https://gstcouncil.gov.in/sites/default/files/2024-02/final-gst-fq-31218.pdf
  type: official
- title: 'CBIC: Central Goods and Services Tax Rules, 2017, Part A (rule 10 and rule 35)'
  url: https://cbic-gst.gov.in/pdf/24092021-CGST-Rules-2017-Part-A-Rules.pdf
  type: official
verification: computed
