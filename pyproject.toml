[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxbench-india"
version = "0.1.0"
description = "A source-cited test suite for AI agents and skills that answer Indian tax questions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["gst", "tds", "india", "agent-skills", "evals", "benchmark"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taxbench = "taxbench.runner:main"

[tool.setuptools]
packages = ["taxbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
